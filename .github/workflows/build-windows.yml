name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Rust/VS Build Tools 由 windows-latest 镜像预置；缓存 cargo 依赖加速复跑
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # onlyBuiltDependencies 已放行 ffmpeg-static postinstall，装依赖即得 win32 静态 ffmpeg
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand 会先跑 fetch-binaries.mjs：
      # 按 win32:x64 拉官方 yt-dlp.exe（SHA-256 校验）+ 复制 ffmpeg-static 二进制到 src-tauri/binaries/
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DownloadAny-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 推 tag（v*）时同步发布到 GitHub Release
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
