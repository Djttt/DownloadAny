name: Build and Publish (Windows + macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 同一 tag 的并发运行会互相覆盖 latest.json（读-改-写合并），串行化整个 ref
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }

      - name: Configure dynamic update endpoint
        env:
          DOWNLOADANY_API_BASE_URL: ${{ vars.DOWNLOADANY_API_BASE_URL }}
        run: pnpm updater:config

      # 手动触发只构建工作流产物，不创建 GitHub Release。
      - name: Build NSIS installer
        if: github.event_name == 'workflow_dispatch'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOWNLOADANY_API_BASE_URL: ${{ vars.DOWNLOADANY_API_BASE_URL }}
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Upload manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DownloadAny-windows-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      # 推送 v* tag 时构建、签名、创建 Release，并生成 latest.json（windows-x86_64 平台键）。
      - name: Publish signed release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOWNLOADANY_API_BASE_URL: ${{ vars.DOWNLOADANY_API_BASE_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DownloadAny ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          generateReleaseNotes: true
          retryAttempts: 2

  macos:
    # 必须串行：tauri-action 的 latest.json 是先拉取同 Release 的旧文件、合并
    # platforms 再删重传（upload-version-json.ts），并发跑会互相覆盖平台条目。
    # Release 已由 windows job 创建，这里按 tagName 找到同一 Release 追加产物。
    needs: windows
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }

      - name: Configure dynamic update endpoint
        env:
          DOWNLOADANY_API_BASE_URL: ${{ vars.DOWNLOADANY_API_BASE_URL }}
        run: pnpm updater:config

      # 手动触发只构建工作流产物，不发布 Release。
      - name: Build app bundle and dmg
        if: github.event_name == 'workflow_dispatch'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOWNLOADANY_API_BASE_URL: ${{ vars.DOWNLOADANY_API_BASE_URL }}
        run: pnpm tauri build --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: Upload manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DownloadAny-macos
          path: |
            src-tauri/target/release/bundle/macos/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
          if-no-files-found: error

      # app bundle 配 createUpdaterArtifacts 产出 .app.tar.gz + .sig，
      # 合并进 latest.json 的 darwin-aarch64 平台键（Apple Silicon）。
      - name: Publish signed release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOWNLOADANY_API_BASE_URL: ${{ vars.DOWNLOADANY_API_BASE_URL }}
        with:
          tagName: ${{ github.ref_name }}
          args: --bundles app,dmg --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true
          retryAttempts: 2
